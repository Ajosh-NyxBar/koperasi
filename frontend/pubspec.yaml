name: kbmt_app
description: "Aplikasi KBMT - Koperasi Konsumen Bina Mutiara Terpadu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Networking
  dio: ^5.4.3+1
  # Routing
  go_router: ^14.2.0
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  smooth_page_indicator: ^1.1.0
  animations: ^2.0.11
  # Utils
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  # Push Notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  # Formatting
  flutter_staggered_animations: ^1.1.1
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
